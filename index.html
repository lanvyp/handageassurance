<html>
<head>
  <title>Hand Landmarks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <h2>Hand Landmark Test</h2>
  <p id="status">loading</p>
  <button id="start-btn" style="display:none" onclick="startCamera()">Start Camera</button>
 
  <!-- webcam -->
  <div style="position:relative; width:640px; height:480px;">
    <video id="video" width="640" height="480" autoplay muted
      style="position:absolute; transform:scaleX(-1)"></video>
    <canvas id="canvas" width="640" height="480"
      style="position:absolute; transform:scaleX(-1)"></canvas>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
